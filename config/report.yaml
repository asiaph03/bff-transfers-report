# BFF Transfers report: sources and business rules.
# Every rule the pipeline applies is read from this file. Change a value here,
# commit it, then run the "Refresh dashboard" workflow by hand to publish.
# Nothing refreshes or publishes on its own.

version: 1

report:
  title: Two Minute Transfers
  lead_label: paid leads
  window_size: 300               # newest N unique paid leads
  allow_fewer_than_window: false # true lets a run publish with fewer than window_size leads

phone:
  digits: 10                     # match on the last N digits, all non-digits removed
  min_digits: 10                 # shorter numbers are treated as blank

ingest:
  # Peak-memory switch only; it never changes a result. false (default) reads all five sources, then calculates.
  # true reads one source at a time and frees it before the next (pipeline/staged.py). Also: --ingest staged|full.
  staged: false

sources:
  ringba:
    spreadsheet_id: 1enoYbZv_cxx3C_ZrZYFU9rqfJTfwCRWfMF5kMJBpr4M
    worksheet: Ringba2
    columns:
      call_id: inboundCallId
      call_time: callDtReadable
      phone: inboundPhoneNumber
      payout: buyerConversionAmount
      connected: buyerHasConnected
      converted: buyerHasConverted
    min_rows: 1000
  ringcx:
    spreadsheet_id: 1klDO_7CNnemoMs5S_pElC_6gIyylUn-SxxkbHv92iCc
    worksheet: Two Minute Transfers
    columns:
      date: Date
      result: Call Result
      agent: Agent Full Name
      phone: ANI
    min_rows: 500
    read_whole_tab: true         # small tab on a slow spreadsheet: one request instead of two
    # Where RingCX rows come from. "sheets" (current, approved) or "postgres" (the BFF table
    # ringcx_inbound, read-only). Switching needs the column mapping and order_by below confirmed and approved.
    backend: sheets
    postgres:
      dsn_env: RINGCX_DATABASE_URL   # GitHub secret holding a read-only connection string; never in this file
      table: public.ringcx_inbound   # maintained outside this project; read only
      columns:                       # from the owner's pgAdmin inspection (Oct 2026)
        date: interaction_date
        result: call_result
        agent: agent_full_name
        phone: ani
        call_id: uii                 # interaction id, NOT a row id: 411 of 1,690 rows repeat a uii (owner's check, Oct 24)
        queue: queue
      queue_value: Two-Minute Transfers
      all_rows_are_queue: false
      # Live read-only checks (Oct 24): interaction_date is a date only; uii repeats across rows of one call;
      # ordering by enqueue_start_time or uii does NOT reproduce the sheet's order for the 59 same-day
      # multi-agent cases. Physical insertion order (ctid) DOES (first and last agent tallies match the sheet
      # for all 18 agents), but ctid is not durable. The owner decided to keep rule U2 (sheet order) and to
      # record insertion order in a real column, source_seq, maintained by the loader. Until that column exists
      # a database run fails closed (undefined column); nothing switches without a clean comparison and approval.
      order_by: [interaction_date, source_seq]
      sequence_column: source_seq    # must be present and unique on every row read, or the run fails
      order_by_approved: false
      approved_for_dashboard: false  # true only after a clean comparison and the owner's approval
      timestamp_timezone: null       # needed only if interaction_date is a zone-aware timestamp
      statement_timeout_s: 60
      max_rows: 500000
      compare_with_sheets: true      # preview aid: also read the sheet and report differences (aggregates only)
  citizen:
    spreadsheet_id: 1URGPKj596-RKXXHTB8o3JoYkaEen-Q2O4EVSTxwvoM8
    worksheet: Affiliate_Clients
    columns:
      phones: [Phone]
      status: Status Name
      close_date: Submitted Date
      debt: Total Enrolled Debt
      agent: Assignees
    min_rows: 10000
    closed_tab: {worksheet: Closed, has_header: false}
  cordoba:
    spreadsheet_id: 16biH5xLWdtEBjcndrN0EdsY8mQBVtNxjd7cbov1-LqE
    worksheet: Contacts
    columns:
      phones: [Home Phone, Cell Phone]
      status: Status
      close_date: Submitted Date
      debt: Enrolled Debt
      agent: Assigned To
    min_rows: 1000
    closed_tab: {worksheet: Closed, has_header: false}
  debtblue:
    spreadsheet_id: 1QnrVN9Nl5PUpIblpGmajV4SoLmkibw9M--t4LmL4pRU
    worksheet: ContactsV2
    columns:
      phones: [Home Phone]
      status: Stage
      close_date: Created
      debt: null                 # ContactsV2 has no debt field; do not substitute one
      agent: Assigned To
    min_rows: 50
    closed_tab: {worksheet: Closed, has_header: true}

paid_leads:
  min_payout_exclusive: 0        # paid when payout > this value
  dedupe: latest_paid_call_per_phone   # U1
  sort_keys: [call_time, call_id]      # newest first by call_time, then call_id

agent_match:
  accepted_result: Inbound Accepted
  rule: first_on_or_after_paid_date    # U2: ties on that date go to the first row in sheet order
  aliases:                             # U3, compared in upper case
    BEN HALL: BENJAMIN HALL
  ringcx_log_start: 2026-04-01         # U5
  label_before_log: Before RingCX log
  label_not_answered: No RingCX answer

lenders:
  order: [citizen, cordoba, debtblue]  # display order; ties on close date go to this order
  display_names: {citizen: Citizen, cordoba: Cordoba, debtblue: DebtBlue}
  closed_statuses:                     # copied from each lender's Closed tab formula
    citizen: [Enrolled, Submitted, Closed, Draft Recovery, Returned, Graduated, Paused, Cancelled]
    cordoba: [Waiting For First Payment, Active, Cancelled, On Hold - NSF, Returned, Contract Needed, Submitted, Cancellation Review]
    debtblue: [Enrolled, Contact, Submitted, Waiting on Deposit, File Returned, Dropped / Cancelled]
  known_non_closing_statuses:          # U8; "" is a blank status
    citizen: [Pending, ""]
    cordoba: [""]
    debtblue: [Contacted, Rejected, ""]
  inactive_statuses: [Cancelled, Returned, Cancellation Review, File Returned, Dropped / Cancelled]  # U4
  close_must_be_on_or_after_paid_date: true   # U6: calendar dates only
  count_each_lead_once: earliest_close_date

closing_agent:
  # Closed-deal attribution, kept separate from the RingCX answering agent (the published `agent` field, which
  # stays as it is for every lead and drives the funnel). Source of truth (owner rule, 24 Oct 2026): the lender
  # CRM record matched by match_closes (same phone, closed-status, close-date and lender-precedence rules).
  # RingCX and the Sales Input HUB / SI tab are never used to pick a closer. Nothing is published until approved.
  source: null                     # null = not enabled: every closed deal is "Closer unknown"; lender = enabled
  unknown_label: Closer unknown
  lender_mapping:                  # PROPOSED for review; build --closer-preview reports it, never publishes it
    lender_values_approved: false  # fields, non-BFF values and the required column below are not approved yet
    fields:                        # ownership field(s) read from the matched lender record; all must agree
      citizen: [Assignees]               # owner decision 24 Oct 2026: the assigned-agent field only; Created By is
                                         # not used. Citizen's sheet labels this field "Assignees" (no "Assigned To").
      cordoba: [Assigned To]             # Created By is "0.0" on 642 of 645 closed records: not usable
      debtblue: [Assigned To]            # mostly DebtBlue / Council Law staff
    require:                       # an extra column that must hold an allowed value for the owner to count as BFF
      debtblue: {column: Assigned Company, values: [Better Future Finance]}
    non_bff_values:                # system accounts and lender staff: never attributed (case-insensitive)
      citizen: [BFF API]
      cordoba: ["0.0"]
      debtblue: [Mayra Vazquez, Olamide Adejumo, Maritza Guzman, Jill Lacy, Roxana Villalta, Osato Iredia, Steve Bellew]
    # APPROVED lender value -> agent display name (owner approval, 24 Oct 2026: these nine exact values only).
    # Matched ignoring case; the approved agent_match alias (Ben Hall -> Benjamin Hall) also applies. Every other
    # value stays "Closer unknown". Used by --closer-preview now; production use still needs source: lender.
    name_map:
      Benjamin Hall: Benjamin Hall           # Cordoba Assigned To
      BENJAMIN HALL: Benjamin Hall           # Citizen Assignees
      Ian Rawley: Ian Rawley                 # Cordoba
      Geneva Lumbley: Geneva Lumbley         # Cordoba
      Lizbeth Dominguez: Lizbeth Dominguez   # Cordoba
      Camaran Hyder: Camaran Hyder           # Cordoba spelling only (Citizen "CAM HYDER" is NOT approved)
      Kris Seiverd: Kris Seiverd             # Cordoba
      Noah Hanusey: Noah Hanusey             # Cordoba
      JAV HYDER: Jav Hyder                   # Citizen
    # Reference only (no longer used by the preview): earlier exact-name proposal, not approved.
    proposed_name_map:
      ARTURO VALENZUELA: Arturo Valenzuela
      AUSTIN BUSH: Austin Bush
      BENJAMIN HALL: Benjamin Hall
      CAMARAN HYDER: Camaran Hyder
      DAVID MORRIS: David Morris
      ERIC HANSEN: Eric Hansen
      GENEVA LUMBLEY: Geneva Lumbley
      IAN RAWLEY: Ian Rawley
      JASON CHARTRAND: Jason Chartrand
      JAV HYDER: Jav Hyder
      KRIS SEIVERD: Kris Seiverd
      LIZBETH DOMINGUEZ: Lizbeth Dominguez
      MAX FROMM: Max Fromm
      NICK MOLINA: Nick Molina
      NOAH HANUSEY: Noah Hanusey
      WASCAR DE JESUS RODRIGUEZ: Wascar De Jesus Rodriguez

validation:
  data_gaps:
    warn_months_without_calls: true    # U7: a warning, not a failure
  max_unparsed_paid_call_times: 0
  closed_tab_cross_check: true         # status filter row count must equal the lender's Closed tab
  baseline:                            # compared with the live summary.json
    required: true                     # first publish only: run with first_release=true
    metrics:
      closed: {max_abs_change: 10, max_pct_change: 0.75}
      active: {max_abs_change: 10, max_pct_change: 0.75}
      debt_enrolled: {max_abs_change: 250000, max_pct_change: 0.75}
      payout: {max_abs_change: 5000, max_pct_change: 0.75}
      answered: {max_abs_change: 60, max_pct_change: 0.25}
  stale_after_days: 14                 # the page warns when the data is older than this

publish:
  site_url: https://asiaph03.github.io/bff-transfers-report/
  lead_id_prefix: P
  fields:                              # the only fields written to the public data file
    - lead_id
    - paid_call
    - week_start
    - month
    - ringba_calls
    - connected
    - converted
    - payout
    - answered
    - agent
    - in_lender_crm
    - in_citizen
    - in_cordoba
    - in_debtblue
    - closed
    - active
    - close_lender
    - close_status
    - close_date
    - days_to_close
    - debt_enrolled
