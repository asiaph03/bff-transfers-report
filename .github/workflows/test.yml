name: Tests

# Runs the rule tests and config check on code or config changes.
# It never reads Google Sheets and never deploys.
on:
  push:
    paths: ["pipeline/**", "config/**", "site/**", ".github/workflows/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q pipeline
      - run: python -m pipeline.build --check-config
