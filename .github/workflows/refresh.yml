name: Refresh dashboard

# Manual only. There is no schedule: data is fetched and published only when
# someone runs this workflow from the Actions tab (or with `gh workflow run`).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = build and validate only; publish = also deploy to GitHub Pages"
        type: choice
        options: [preview, publish]
        default: preview
      first_release:
        description: "Only for the first approved publication (no published baseline exists yet)"
        type: boolean
        default: false
      ringcx_source:
        description: "RingCX source. postgres-compare reads public.ringcx_inbound read-only and compares it with the sheet (preview only)"
        type: choice
        options: [config, postgres-compare]
        default: config

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Test, fetch, calculate and validate
    runs-on: ubuntu-latest
    timeout-minutes: 70   # the pipeline stops itself after 40 min of Google reads; plus the full test suite (about 9 min here, 15 allowed), install and uploads
    permissions:
      contents: read
      id-token: write   # lets this job sign in to Google without a stored key
    outputs:            # the verified candidate report, read by the deploy job's stale-deployment guard and live check
      refreshed_at: ${{ steps.candidate.outputs.refreshed_at }}
      version: ${{ steps.candidate.outputs.version }}
      data_bytes: ${{ steps.candidate.outputs.data_bytes }}
      rows: ${{ steps.candidate.outputs.rows }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Rule tests (synthetic data)
        run: python -m pytest -q pipeline

      - name: Check config
        run: python -m pipeline.build --check-config

      - name: Sign in to Google (keyless, read-only)
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Writes a keyless Workload Identity credentials file (no private key, removed when the job
          # ends) and sets GOOGLE_APPLICATION_CREDENTIALS. The pipeline loads it with google-auth, asks
          # only for the spreadsheets.readonly scope, and refreshes the token whenever it expires.
          create_credentials_file: true
          export_environment_variables: true

      - name: Fetch Google Sheets, calculate, validate
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Read-only connection string, used only when sources.ringcx.backend is postgres. Never printed.
          RINGCX_DATABASE_URL: ${{ secrets.RINGCX_DATABASE_URL }}
        run: |
          set -o pipefail
          FLAGS=""
          if [ "${{ inputs.mode }}" = "preview" ]; then FLAGS="--preview"; fi
          if [ "${{ inputs.ringcx_source }}" = "postgres-compare" ]; then
            if [ "${{ inputs.mode }}" != "preview" ]; then echo "postgres-compare is preview only"; exit 1; fi
            if [ -z "$RINGCX_DATABASE_URL" ]; then echo "RINGCX_DATABASE_URL secret is not set"; exit 1; fi
            FLAGS="$FLAGS --ringcx-backend postgres"
          fi
          if [ "${{ inputs.first_release }}" = "true" ]; then
            if [ "${{ inputs.mode }}" != "publish" ]; then echo "first_release only applies to publish"; exit 1; fi
            FLAGS="$FLAGS --first-release"
          fi
          python -m pipeline.build --out out $FLAGS

      # Independent of the build step: reads the written files back from disk. A failure here stops the job before
      # anything is uploaded, so the live site is untouched.
      - name: Verify the built site (files, manifest, timestamps, fields, privacy)
        id: candidate
        run: python -m pipeline.verify_site out/site --github-output "$GITHUB_OUTPUT" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: out/validation.md
          if-no-files-found: warn
          retention-days: 30

      - name: Write report to the run summary
        if: always()
        run: if [ -f out/validation.md ]; then cat out/validation.md >> "$GITHUB_STEP_SUMMARY"; fi

      # Also the recovery copy: every successful publish run keeps exactly the verified files for 90 days (previews 14).
      - name: Site preview (for review) and recovery copy
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: out/site
          include-hidden-files: true
          retention-days: ${{ inputs.mode == 'publish' && 90 || 14 }}

      - name: Package for GitHub Pages
        if: success() && inputs.mode == 'publish'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 25   # the guard, the deployment, and up to about 12 minutes of waiting for the CDN
    permissions:
      actions: read       # the run-history guard reads this workflow's runs and jobs (read only)
      contents: read      # to check out the checks below (standard library only; nothing is installed)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # An older run never publishes over a newer one: refuse if a newer run of this workflow has reached (or may have reached) the
      # deployment step, whatever the CDN shows. Fails closed on any API problem. No first-release exemption. Runs first, before
      # the CDN-based guard below and before anything is deployed.
      - name: Refuse to publish over a newer run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 -m pipeline.run_guard --repo="$REPO" --run-id="$RUN_ID"

      # Never deploy an older report over a newer one, and fail closed when the live report cannot be read or trusted
      # (only a run started with first_release skips the comparison). Runs before anything is deployed.
      - name: Refuse to replace a newer live report
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          CANDIDATE_REFRESHED_AT: ${{ needs.build.outputs.refreshed_at }}
          FIRST_RELEASE: ${{ inputs.first_release }}
        run: |
          FLAG=""
          if [ "$FIRST_RELEASE" = "true" ]; then FLAG="--first-release"; fi
          python3 -m pipeline.live_check guard --url="$SITE_URL" --candidate-refreshed-at="$CANDIDATE_REFRESHED_AT" $FLAG

      # The name is read by the run-history guard (pipeline/run_guard.py) of later runs: change it only together with DEPLOY_STEP_NAME there.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # A smoke test of the live site, not a rollback: if it fails the deployment may already have happened.
      - name: Verify the live site serves the candidate report
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
          CANDIDATE_REFRESHED_AT: ${{ needs.build.outputs.refreshed_at }}
          CANDIDATE_VERSION: ${{ needs.build.outputs.version }}
          CANDIDATE_DATA_BYTES: ${{ needs.build.outputs.data_bytes }}
          CANDIDATE_ROWS: ${{ needs.build.outputs.rows }}
        run: |
          # Every value is passed as --name=value: a report version is base64url and starts with "-" about one time in 64, and
          # argparse would read "--version -abc..." as a missing value and fail the check after a successful deployment.
          python3 -m pipeline.live_check verify --url="$LIVE_URL" --refreshed-at="$CANDIDATE_REFRESHED_AT" --version="$CANDIDATE_VERSION" \
            --data-bytes="$CANDIDATE_DATA_BYTES" --rows="$CANDIDATE_ROWS" --deadline=720 --interval=30
